[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "riot-research-collector"
version = "0.1.0"
description = "Resumable raw Riot Match-V5 collection for offline research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29"]

[project.scripts]
riot-collector = "riot_collector.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/riot_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

